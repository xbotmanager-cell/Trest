name: HEY DANE Android Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    name: Analyze, Test & Build APK/AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set Up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 35 & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set Up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Tooling Versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Ensure Android Gradle Wrapper Exists
        working-directory: android
        run: |
          if [ ! -f ./gradlew ] || [ ! -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x ./gradlew

      - name: Verify Dart Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Flutter Static Analysis
        run: flutter analyze --fatal-infos

      - name: Run Flutter Tests
        run: flutter test

      - name: Configure Android Release Signing (if secrets provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-keystore.jks
          EOF
            echo "Release signing configured."
          else
            echo "Signing secrets not configured; building with debug signing fallback for CI verification."
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Release App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Verify Generated Build Artifacts
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          test -f build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - name: Clean Up Signing Credentials
        if: always()
        run: |
          rm -f android/app/release-keystore.jks android/key.properties

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hey-dane-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hey-dane-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
